<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Audiophile Space</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #c084fc;
            --primary-hover: #a855f7;
            --secondary: #22d3ee;
            --bg-glass: rgba(10, 10, 10, 0.25);
            --bg-glass-heavy: rgba(12, 12, 12, 0.35);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --text-muted: #6b7280;
            --glass-blur: blur(20px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: url('प्यारे.png') no-repeat center 20% fixed;
            background-size: cover;
            color: var(--text-main);
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: -2;
        }

        /* ---------- Top-right status cluster ---------- */
        #status-cluster {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 900;
            display: flex;
            align-items: stretch;
            gap: 0.6rem;
        }

        .status-card {
            background: var(--bg-glass-heavy);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            box-shadow: 0 8px 28px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #clock-card { padding: 0.6rem 1.1rem; min-width: 148px; }

        #clock-time {
            font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 1.5px;
            line-height: 1.05;
            font-variant-numeric: tabular-nums;
        }

        #clock-time .seconds { font-size: 0.85rem; color: var(--primary); margin-left: 2px; }
        #clock-time .meridiem { font-size: 0.7rem; color: var(--text-sub); margin-left: 4px; letter-spacing: 1px; }

        #clock-date {
            font-size: 0.63rem;
            text-transform: uppercase;
            letter-spacing: 1.4px;
            color: var(--text-sub);
            margin-top: 0.2rem;
            font-weight: 600;
        }

        #online-card { padding: 0.6rem 0.9rem; min-width: 74px; cursor: default; }

        #online-count {
            font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
            font-size: 1.15rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            line-height: 1.1;
        }

        .pulse-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
            animation: pulse 2s ease-in-out infinite;
        }

        .pulse-dot.offline { background: var(--text-muted); box-shadow: none; animation: none; }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.45; transform: scale(0.82); }
        }

        #online-label {
            font-size: 0.58rem;
            text-transform: uppercase;
            letter-spacing: 1.3px;
            color: var(--text-sub);
            margin-top: 0.2rem;
            font-weight: 600;
        }

        /* ---------- Sidebar ---------- */
        #sidebar {
            position: fixed;
            top: 0; left: -320px;
            width: 320px; height: 100vh;
            background: rgba(12, 12, 12, 0.5);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-right: 1px solid var(--border-glass);
            z-index: 1000;
            transition: left 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            box-shadow: 15px 0 35px rgba(0, 0, 0, 0.4);
        }

        #sidebar.open { left: 0; }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 0.75rem;
        }

        .sidebar-header h2 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.3px; }

        .close-sidebar-btn {
            background: none; border: none;
            color: var(--text-sub);
            font-size: 1.2rem; cursor: pointer;
            transition: color 0.2s;
        }
        .close-sidebar-btn:hover { color: #ef4444; }

        .sidebar-section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-sub);
            margin-bottom: 0.75rem;
            margin-top: 1rem;
            font-weight: 700;
        }

        .playlists-container { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.5rem; }

        .playlist-tab {
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.2s;
        }

        .playlist-tab:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.08); }
        .playlist-tab.active { background: rgba(192,132,252,0.1); border-color: rgba(192,132,252,0.2); color: var(--primary); }

        #library { display: flex; flex-direction: column; gap: 0.5rem; overflow-y: auto; flex-grow: 1; padding-right: 0.25rem; }
        #library::-webkit-scrollbar { width: 4px; }
        #library::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        .track {
            cursor: pointer;
            padding: 0.75rem;
            background: rgba(255,255,255,0.01);
            border: 1px solid transparent;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .track:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.06); }
        .track.active { background: rgba(192,132,252,0.08); border-color: rgba(192,132,252,0.18); }

        .track-info { display: flex; flex-direction: column; gap: 0.15rem; max-width: 85%; }
        .track-title { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-artist { font-size: 0.75rem; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .play-indicator-dot {
            width: 6px; height: 6px;
            background: var(--primary);
            border-radius: 50%;
            display: none;
            box-shadow: 0 0 8px var(--primary);
        }
        .track.active .play-indicator-dot { display: block; }

        .sidebar-trigger {
            position: fixed;
            top: 1.5rem; left: 1.5rem;
            background: rgba(10,10,10,0.3);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-glass);
            border-radius: 50%;
            width: 48px; height: 48px;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-main);
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 900;
            box-shadow: 0 4px 16px rgba(0,0,0,0.25);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .sidebar-trigger:hover { transform: scale(1.08); background: rgba(255,255,255,0.08); color: var(--primary); }

        /* ---------- Bottom dock ---------- */
        #bottom-container {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            z-index: 500;
        }

        #player-dock {
            background: var(--bg-glass-heavy);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 1.15rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            box-shadow: 0 16px 40px rgba(0,0,0,0.35);
        }

        .player-info-container { display: flex; align-items: center; gap: 1rem; width: 220px; flex-shrink: 0; }

        .album-art-wrapper {
            position: relative;
            width: 50px; height: 50px;
            border-radius: 50%;
            overflow: hidden;
            border: 1.5px solid rgba(255,255,255,0.12);
            flex-shrink: 0;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            background: #111;
            display: flex; align-items: center; justify-content: center;
        }

        .album-art-wrapper i { font-size: 1.25rem; color: var(--text-sub); position: absolute; }

        .album-art-image {
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: 50%;
            animation: rotateDisk 12s linear infinite;
            animation-play-state: paused;
            z-index: 2;
        }

        @keyframes rotateDisk {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .track-meta { display: flex; flex-direction: column; gap: 0.1rem; overflow: hidden; }

        #now-playing-title { font-size: 0.88rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #now-playing-artist { font-size: 0.72rem; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #now-playing-artist.error { color: #f87171; }

        .audio-controls-container { flex-grow: 1; display: flex; flex-direction: column; gap: 0.45rem; }
        .playback-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }

        .control-btn {
            background: none; border: none;
            color: var(--text-main);
            font-size: 1rem; cursor: pointer;
            transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
            width: 30px; height: 30px;
            border-radius: 50%;
        }

        .control-btn:hover { color: var(--primary); background: rgba(255,255,255,0.04); }
        .control-btn.active { color: var(--primary); }

        .control-btn.play-pause {
            background: var(--primary);
            color: #000;
            font-size: 0.95rem;
            width: 36px; height: 36px;
        }
        .control-btn.play-pause:hover { background: var(--primary-hover); transform: scale(1.05); }

        .dsp-toggle-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            font-size: 0.72rem;
            font-weight: 600;
            padding: 0.3rem 0.6rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex; align-items: center; gap: 0.4rem;
            white-space: nowrap;
        }

        .dsp-toggle-btn.enabled {
            background: rgba(192,132,252,0.2);
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 10px rgba(192,132,252,0.2);
        }

        .dsp-toggle-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .seeker-row { display: flex; align-items: center; gap: 0.75rem; width: 100%; }
        .time-label { font-size: 0.68rem; font-family: monospace; color: var(--text-sub); width: 35px; text-align: center; }

        .seeker-bar-container { flex-grow: 1; position: relative; height: 12px; display: flex; align-items: center; cursor: pointer; }

        .seeker-bar-bg { position: absolute; left: 0; right: 0; height: 4px; background: rgba(255,255,255,0.12); border-radius: 6px; transition: height 0.1s; }
        .seeker-bar-buffered { position: absolute; left: 0; height: 4px; background: rgba(255,255,255,0.18); border-radius: 6px; width: 0%; transition: height 0.1s; }
        .seeker-bar-progress { position: absolute; left: 0; height: 4px; background: linear-gradient(90deg, var(--primary) 0%, #d8b4fe 100%); border-radius: 6px; width: 0%; transition: height 0.1s; }

        .seeker-knob {
            position: absolute;
            width: 10px; height: 10px;
            background: #fff;
            border-radius: 50%;
            left: 0%;
            transform: translateX(-50%);
            box-shadow: 0 0 8px var(--primary);
            display: none;
        }

        .seeker-bar-container:hover .seeker-bar-bg,
        .seeker-bar-container:hover .seeker-bar-buffered,
        .seeker-bar-container:hover .seeker-bar-progress { height: 6px; }
        .seeker-bar-container:hover .seeker-knob { display: block; }

        .seeker-tooltip {
            position: absolute;
            bottom: 20px;
            background: rgba(15,15,15,0.9);
            border: 1px solid var(--border-glass);
            border-radius: 4px;
            padding: 0.2rem 0.4rem;
            font-size: 0.68rem;
            font-family: monospace;
            color: #fff;
            pointer-events: none;
            display: none;
            transform: translateX(-50%);
            white-space: nowrap;
            z-index: 100;
        }

        .volume-container { display: flex; align-items: center; gap: 0.4rem; margin-left: 0.5rem; position: relative; }
        .volume-bar-container { width: 60px; height: 12px; display: flex; align-items: center; cursor: pointer; }
        .volume-bar { width: 100%; height: 3px; background: rgba(255,255,255,0.12); border-radius: 3px; position: relative; transition: height 0.1s; }
        .volume-progress { position: absolute; left: 0; top: 0; height: 100%; width: 80%; background: var(--text-main); border-radius: 3px; }
        .volume-bar-container:hover .volume-bar { height: 5px; }

        /* ---------- DSP panel ---------- */
        #dsp-panel {
            background: var(--bg-glass);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 0.9rem 1.25rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            display: none;
            gap: 1.25rem;
            align-items: stretch;
        }

        #dsp-panel.open { display: flex; }

        .dsp-col { display: flex; flex-direction: column; gap: 0.55rem; }
        .dsp-col.eq { flex: 0 0 210px; }
        .dsp-col.toggles { flex: 0 0 130px; justify-content: flex-start; }
        .dsp-col.scope { flex: 1 1 auto; min-width: 0; }

        .dsp-heading {
            font-size: 0.58rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .eq-row { display: flex; align-items: center; gap: 0.55rem; }
        .eq-row label { font-size: 0.65rem; color: var(--text-sub); width: 42px; font-weight: 600; }

        .eq-row input[type=range] {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 3px;
            border-radius: 3px;
            background: rgba(255,255,255,0.14);
            outline: none;
            cursor: pointer;
        }

        .eq-row input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 11px; height: 11px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 6px rgba(192,132,252,0.6);
            cursor: pointer;
        }

        .eq-row input[type=range]::-moz-range-thumb {
            width: 11px; height: 11px;
            border: none;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
        }

        .eq-val {
            font-family: monospace;
            font-size: 0.62rem;
            color: var(--secondary);
            width: 40px;
            text-align: right;
        }

        .mini-toggle {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.09);
            color: var(--text-sub);
            font-size: 0.65rem;
            font-weight: 600;
            padding: 0.32rem 0.5rem;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.18s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .mini-toggle:hover { background: rgba(255,255,255,0.08); color: var(--text-main); }

        .mini-toggle.on {
            background: rgba(34,211,238,0.14);
            border-color: rgba(34,211,238,0.45);
            color: var(--secondary);
        }

        .mini-toggle .dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--text-muted);
            flex-shrink: 0;
        }
        .mini-toggle.on .dot { background: var(--secondary); box-shadow: 0 0 6px var(--secondary); }

        #scope-canvas {
            width: 100%;
            height: 74px;
            display: block;
            border-radius: 8px;
            background: rgba(0,0,0,0.22);
        }

        /* ---------- Spec bar (real values only) ---------- */
        #spec-bar {
            background: var(--bg-glass);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 0.7rem 1.25rem;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
        }

        .spec-item { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

        .spec-label {
            font-size: 0.58rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 0.2rem;
        }

        .spec-value {
            font-size: 0.74rem;
            font-family: monospace;
            font-weight: 600;
            color: var(--primary);
        }

        .spec-value.dim { color: var(--text-muted); }
        .spec-value.warn { color: #fbbf24; }

        .status-indicator {
            display: inline-block;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #10b981;
            margin-right: 4px;
            box-shadow: 0 0 8px #10b981;
        }
        .status-indicator.processing { background: var(--primary); box-shadow: 0 0 8px var(--primary); }
        .status-indicator.failed { background: #ef4444; box-shadow: 0 0 8px #ef4444; }

        @media (max-width: 860px) {
            #dsp-panel { flex-wrap: wrap; }
            .dsp-col.scope { flex: 1 1 100%; }
            #spec-bar { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 640px) {
            #clock-card { min-width: 0; padding: 0.5rem 0.8rem; }
            #clock-time { font-size: 1.15rem; }
            #clock-date { display: none; }
        }
    </style>
</head>
<body>

    <button class="sidebar-trigger" id="sidebar-toggle" title="Open Library">
        <i class="fa-solid fa-bars"></i>
    </button>

    <div id="status-cluster">
        <div class="status-card" id="online-card" title="Listeners currently on this page">
            <div id="online-count"><span class="pulse-dot offline" id="online-dot"></span><span id="online-num">–</span></div>
            <div id="online-label">Online</div>
        </div>
        <div class="status-card" id="clock-card">
            <div id="clock-time">--:--</div>
            <div id="clock-date">&nbsp;</div>
        </div>
    </div>

    <div id="sidebar">
        <div class="sidebar-header">
            <h2>Audio Space</h2>
            <button class="close-sidebar-btn" id="sidebar-close" title="Close">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="sidebar-section-title">Playlists</div>
        <div class="playlists-container" id="playlists-list"></div>

        <div class="sidebar-section-title">Tracks</div>
        <div id="library"></div>
    </div>

    <div id="bottom-container">
        <div id="player-dock">
            <div class="player-info-container">
                <div class="album-art-wrapper">
                    <i class="fa-solid fa-compact-disc"></i>
                    <img id="album-art" class="album-art-image" src="" alt="" style="display:none;">
                </div>
                <div class="track-meta">
                    <span id="now-playing-title">No Track Selected</span>
                    <span id="now-playing-artist">Open sidebar to play</span>
                </div>
            </div>

            <div class="audio-controls-container">
                <div class="seeker-row">
                    <span id="time-current" class="time-label">0:00</span>
                    <div class="seeker-bar-container" id="seeker-container">
                        <div class="seeker-bar-bg"></div>
                        <div class="seeker-bar-buffered" id="seeker-buffered"></div>
                        <div class="seeker-bar-progress" id="seeker-progress"></div>
                        <div class="seeker-knob" id="seeker-knob"></div>
                        <div class="seeker-tooltip" id="seeker-tooltip">0:00 - 0%</div>
                    </div>
                    <span id="time-total" class="time-label">0:00</span>
                </div>

                <div class="playback-row">
                    <button class="control-btn" id="btn-shuffle" title="Shuffle"><i class="fa-solid fa-shuffle"></i></button>
                    <button class="control-btn" id="btn-prev" title="Previous"><i class="fa-solid fa-backward-step"></i></button>
                    <button class="control-btn play-pause" id="btn-play-pause" title="Play/Pause"><i class="fa-solid fa-play" id="play-icon"></i></button>
                    <button class="control-btn" id="btn-next" title="Next"><i class="fa-solid fa-forward-step"></i></button>

                    <div class="volume-container">
                        <button class="control-btn" id="btn-mute" style="font-size:0.95rem; width:24px; height:24px;" title="Mute"><i class="fa-solid fa-volume-high" id="mute-icon"></i></button>
                        <div class="volume-bar-container" id="volume-slider">
                            <div class="volume-bar">
                                <div class="volume-progress" id="volume-progress"></div>
                            </div>
                        </div>
                    </div>

                    <button class="dsp-toggle-btn" id="toggle-dsp" title="Show the signal processing chain">
                        <i class="fa-solid fa-sliders"></i> DSP
                    </button>
                </div>
            </div>
        </div>

        <!-- Real signal processing controls -->
        <div id="dsp-panel">
            <div class="dsp-col eq">
                <span class="dsp-heading">Equaliser</span>

                <div class="eq-row">
                    <label for="eq-bass">Bass</label>
                    <input type="range" id="eq-bass" min="-12" max="12" step="0.5" value="0">
                    <span class="eq-val" id="eq-bass-val">0.0 dB</span>
                </div>

                <div class="eq-row">

        <!-- Measured values only — nothing here is invented -->

                <span class="spec-value" style="display:flex;align-items:center;">

    </div>

    <audio id="audio" preload="metadata" style="display:none;"></audio>

    <script>
        /* ============================================================
           CONFIG
           ============================================================ */
        const PLAYLIST_API  = 'https://script.google.com/macros/s/AKfycbyO05GfIiGJlgKEhZwtK9mIxD0Ox5dvXS_H7wMAH8nZWGPPWmzsZSON7w0lGK_i6CTK/exec';
        const DRIVE_API_KEY = 'AIzaSyCQKib3-SorQYL_eeiaNCpVxE-So6gIn_c';

        const USE_24_HOUR  = false;
        const HEARTBEAT_MS = 25000;

        function streamUrlFor(track) {
            return `https://www.googleapis.com/drive/v3/files/${track.id}?alt=media&key=${DRIVE_API_KEY}`;
        }

        /* ============================================================
           DIGITAL CLOCK
           ============================================================ */
        const clockTime = document.getElementById('clock-time');
        const clockDate = document.getElementById('clock-date');

        function tickClock() {
            const now = new Date();
            let h = now.getHours();
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            let meridiem = '';

            if (!USE_24_HOUR) {
                meridiem = h >= 12 ? 'PM' : 'AM';
                h = h % 12 || 12;
            }

            const hh = USE_24_HOUR ? String(h).padStart(2, '0') : String(h);

            clockTime.innerHTML = `${hh}:${m}<span class="seconds">${s}</span>` +
                (meridiem ? `<span class="meridiem">${meridiem}</span>` : '');

            clockDate.innerText = now.toLocaleDateString(undefined, {
                weekday: 'short', day: 'numeric', month: 'short'
            });
        }
        tickClock();
        setInterval(tickClock, 1000);

        /* ============================================================
           PRESENCE

           Parameter is `uid`, not `sid`. A parameter literally named
           `sid` is rejected with a 400 at Google's edge before the
           request reaches Apps Script — every value tested failed,
           and adding it to a working URL broke that URL.
           ============================================================ */
        const onlineNum = document.getElementById('online-num');
        const onlineDot = document.getElementById('online-dot');

        function getSessionId() {
            let sid;
            try {
                sid = sessionStorage.getItem('aura_uid');
                if (!sid) {
                    sid = 'u' + Math.floor(Math.random() * 1e9);
                    sessionStorage.setItem('aura_uid', sid);
                }
            } catch (e) {
                sid = 'u' + Math.floor(Math.random() * 1e9);
            }
            return sid;
        }

        const SESSION_ID = getSessionId();
        let presenceFailures = 0;

        async function sendHeartbeat() {
            if (document.hidden) return;

            const url = `${PLAYLIST_API}?uid=${encodeURIComponent(SESSION_ID)}`;

            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error('HTTP ' + res.status);

                const data = await res.json();
                if (Array.isArray(data)) throw new Error('uid route not deployed (got playlist array)');

                onlineNum.innerText = Number(data.online) || 1;
                onlineDot.classList.remove('offline');
                presenceFailures = 0;

                if (data.error) console.warn('[Aura] presence reported:', data.error);

            } catch (err) {
                presenceFailures++;
                console.warn(`[Aura] presence unavailable (${presenceFailures}):`, err.message, url);
                if (presenceFailures >= 2) {
                    onlineNum.innerText = '–';
                    onlineDot.classList.add('offline');
                }
            }
        }

        sendHeartbeat();
        setInterval(sendHeartbeat, HEARTBEAT_MS);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) sendHeartbeat(); });

        /* ============================================================
           ELEMENT REFS
           ============================================================ */
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const sidebarClose = document.getElementById('sidebar-close');

        const libraryEl = document.getElementById('library');
        const audioEl = document.getElementById('audio');
        const albumArtImg = document.getElementById('album-art');
        const dockTitleEl = document.getElementById('now-playing-title');
        const dockArtistEl = document.getElementById('now-playing-artist');
        const playlistList = document.getElementById('playlists-list');

        const playPauseBtn = document.getElementById('btn-play-pause');
        const playIcon = document.getElementById('play-icon');
        const prevBtn = document.getElementById('btn-prev');
        const nextBtn = document.getElementById('btn-next');
        const shuffleBtn = document.getElementById('btn-shuffle');
        const currentLabel = document.getElementById('time-current');
        const totalLabel = document.getElementById('time-total');
        const seekerContainer = document.getElementById('seeker-container');
        const seekerProgress = document.getElementById('seeker-progress');
        const seekerBuffered = document.getElementById('seeker-buffered');
        const seekerKnob = document.getElementById('seeker-knob');
        const seekerTooltip = document.getElementById('seeker-tooltip');
        const volumeSlider = document.getElementById('volume-slider');
        const volumeProgress = document.getElementById('volume-progress');
        const muteBtn = document.getElementById('btn-mute');
        const muteIcon = document.getElementById('mute-icon');

        const toggleDspBtn = document.getElementById('toggle-dsp');
        const dspPanel = document.getElementById('dsp-panel');
        const scopeCanvas = document.getElementById('scope-canvas');
        const scopeNote = document.getElementById('scope-note');

        const specFormat = document.getElementById('spec-format');
        const specRate = document.getElementById('spec-rate');
        const specBitrate = document.getElementById('spec-bitrate');
        const specOutput = document.getElementById('spec-output');
        const specPath = document.getElementById('spec-path');
        const statusLight = document.getElementById('status-light');

        let allTracks = [];
        let visibleTracks = [];
        let currentIndex = -1;
        let isShuffle = false;

        sidebarToggle.onclick = () => sidebar.classList.add('open');
        sidebarClose.onclick = () => sidebar.classList.remove('open');

        /* ============================================================
           WEB AUDIO DSP CHAIN

           Signal path:
             <audio> -> MediaElementSource
                     -> lowShelf (bass)
                     -> peaking  (mid)
                     -> highShelf(treble)
                     -> crossfeed matrix (splitter/delay/lowpass/merger)
                     -> compressor (transparent when off)
                     -> analyser
                     -> makeup gain
                     -> destination

           Routing an element through Web Audio requires CORS. If the
           source is cross-origin without CORS headers the graph goes
           SILENT rather than erroring, so we verify the audio is
           actually non-silent after starting and fall back to plain
           playback if it isn't.
           ============================================================ */
        let ctx = null;
        let srcNode = null;
        let bassNode, midNode, trebleNode;
        let splitter, merger, delayL, delayR, cfLowL, cfLowR, cfGainL, cfGainR, directL, directR;
        let compNode, analyser, makeupGain;
        let dspReady = false;
        let dspFailed = false;
        let scopeRaf = null;

        const dspState = {
            bass: 0, mid: 0, treble: 0, gain: 0,
            crossfeed: false, compressor: false, mono: false
        };

        function buildGraph() {
            if (ctx) return true;

            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) throw new Error('Web Audio not supported');

                ctx = new AC();
                srcNode = ctx.createMediaElementSource(audioEl);

                // --- 3-band EQ ---
                bassNode = ctx.createBiquadFilter();
                bassNode.type = 'lowshelf';
                bassNode.frequency.value = 120;

                midNode = ctx.createBiquadFilter();
                midNode.type = 'peaking';
                midNode.frequency.value = 1000;
                midNode.Q.value = 1.0;

                trebleNode = ctx.createBiquadFilter();
                trebleNode.type = 'highshelf';
                trebleNode.frequency.value = 6000;

                // --- Crossfeed matrix ---
                // Each channel gets a delayed, low-passed copy of the
                // other mixed in. ~270us and 700Hz approximate the
                // interaural time difference and head shadowing that
                // speakers produce naturally and headphones don't.
                splitter = ctx.createChannelSplitter(2);
                merger = ctx.createChannelMerger(2);

                directL = ctx.createGain();
                directR = ctx.createGain();
                directL.gain.value = 1;
                directR.gain.value = 1;

                delayL = ctx.createDelay(0.01);
                delayR = ctx.createDelay(0.01);
                delayL.delayTime.value = 0.00027;
                delayR.delayTime.value = 0.00027;

                cfLowL = ctx.createBiquadFilter();
                cfLowR = ctx.createBiquadFilter();
                cfLowL.type = 'lowpass';
                cfLowR.type = 'lowpass';
                cfLowL.frequency.value = 700;
                cfLowR.frequency.value = 700;

                cfGainL = ctx.createGain();
                cfGainR = ctx.createGain();
                cfGainL.gain.value = 0;   // off until enabled
                cfGainR.gain.value = 0;

                // direct paths
                splitter.connect(directL, 0);
                splitter.connect(directR, 1);
                directL.connect(merger, 0, 0);
                directR.connect(merger, 0, 1);

                // cross paths: L -> right output, R -> left output
                splitter.connect(delayL, 0);
                delayL.connect(cfLowL);
                cfLowL.connect(cfGainL);
                cfGainL.connect(merger, 0, 1);

                splitter.connect(delayR, 1);
                delayR.connect(cfLowR);
                cfLowR.connect(cfGainR);
                cfGainR.connect(merger, 0, 0);

                // --- Compressor (transparent at ratio 1 / threshold 0) ---
                compNode = ctx.createDynamicsCompressor();
                compNode.threshold.value = 0;
                compNode.knee.value = 30;
                compNode.ratio.value = 1;
                compNode.attack.value = 0.01;
                compNode.release.value = 0.25;

                analyser = ctx.createAnalyser();
                analyser.fftSize = 2048;
                analyser.smoothingTimeConstant = 0.8;

                makeupGain = ctx.createGain();
                makeupGain.gain.value = 1;

                srcNode.connect(bassNode);
                bassNode.connect(midNode);
                midNode.connect(trebleNode);
                trebleNode.connect(splitter);
                merger.connect(compNode);
                compNode.connect(analyser);
                analyser.connect(makeupGain);
                makeupGain.connect(ctx.destination);

                dspReady = true;
                applyDspState();
                updateOutputSpec();
                return true;

            } catch (err) {
                console.error('[Aura] Web Audio graph failed:', err);
                dspFailed = true;
                dspReady = false;
                return false;
            }
        }

        function applyDspState() {
            if (!dspReady) return;

            bassNode.gain.value = dspState.bass;
            midNode.gain.value = dspState.mid;
            trebleNode.gain.value = dspState.treble;
            makeupGain.gain.value = Math.pow(10, dspState.gain / 20);

            const cf = dspState.crossfeed ? 0.5 : 0;
            cfGainL.gain.value = cf;
            cfGainR.gain.value = cf;

            // Mono = full cross-mix at equal gain with the direct paths halved
            if (dspState.mono) {
                directL.gain.value = 0.5;
                directR.gain.value = 0.5;
                cfGainL.gain.value = 0.5;
                cfGainR.gain.value = 0.5;
                cfLowL.frequency.value = 20000;
                cfLowR.frequency.value = 20000;
                delayL.delayTime.value = 0;
                delayR.delayTime.value = 0;
            } else {
                directL.gain.value = 1;
                directR.gain.value = 1;
                cfLowL.frequency.value = 700;
                cfLowR.frequency.value = 700;
                delayL.delayTime.value = 0.00027;
                delayR.delayTime.value = 0.00027;
            }

            if (dspState.compressor) {
                compNode.threshold.value = -24;
                compNode.ratio.value = 6;
            } else {
                compNode.threshold.value = 0;
                compNode.ratio.value = 1;
            }

            updatePathSpec();
        }

        function activeChainLabel() {
            if (dspFailed) return 'DIRECT (no DSP)';
            if (!dspReady) return 'DIRECT';

            const parts = [];
            if (dspState.bass || dspState.mid || dspState.treble) parts.push('EQ');
            if (dspState.crossfeed) parts.push('XFEED');
            if (dspState.compressor) parts.push('COMP');
            if (dspState.mono) parts.push('MONO');
            if (dspState.gain) parts.push('GAIN');

            return parts.length ? parts.join(' + ') : 'FLAT (bypass)';
        }

        function updatePathSpec() {
            specPath.innerText = audioEl.paused ? 'IDLE' : activeChainLabel();
            if (dspFailed) {
                statusLight.className = 'status-indicator failed';
            } else if (!audioEl.paused) {
                statusLight.className = 'status-indicator processing';
            } else {
                statusLight.className = 'status-indicator';
            }
        }

        function updateOutputSpec() {
            if (ctx) {
                specOutput.classList.remove('dim');
                specOutput.innerText = `${(ctx.sampleRate / 1000).toFixed(1)} kHz float32`;
                specOutput.title = 'The browser mixes all audio at this rate. A web page cannot ' +
                                   'take exclusive control of your DAC, so this is the real output rate ' +
                                   'regardless of the source file.';
            }
        }

        /* --- Silence detection: catches a CORS-tainted graph --- */
        function verifyAudible() {
            if (!dspReady) return;

            const buf = new Uint8Array(analyser.frequencyBinCount);
            let checks = 0;
            let sawSignal = false;

            const probe = setInterval(() => {
                if (audioEl.paused) return;
                analyser.getByteFrequencyData(buf);
                let sum = 0;
                for (let i = 0; i < buf.length; i++) sum += buf[i];
                if (sum > 0) sawSignal = true;

                if (++checks >= 10) {
                    clearInterval(probe);
                    if (!sawSignal && audioEl.currentTime > 0.5) {
                        console.error('[Aura] Web Audio graph is silent — the source is likely ' +
                                      'not sending CORS headers. Falling back to direct playback.');
                        scopeNote.innerText = '(unavailable — CORS)';
                        dspFailed = true;
                        disableDspUi();
                    }
                }
            }, 200);
        }

        function disableDspUi() {
            ['eq-bass','eq-mid','eq-treble','eq-gain'].forEach(id => {
                const el = document.getElementById(id);
                el.disabled = true;
                el.style.opacity = 0.35;
            });
            ['tg-crossfeed','tg-compressor','tg-mono'].forEach(id => {
                const el = document.getElementById(id);
                el.classList.remove('on');
                el.style.opacity = 0.35;
                el.style.pointerEvents = 'none';
            });
            updatePathSpec();
        }

        /* --- Spectrum analyser --- */
        const scopeCtx = scopeCanvas.getContext('2d');

        function sizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const rect = scopeCanvas.getBoundingClientRect();
            if (rect.width === 0) return;
            scopeCanvas.width = Math.floor(rect.width * dpr);
            scopeCanvas.height = Math.floor(rect.height * dpr);
            scopeCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener('resize', sizeCanvas);

        function drawScope() {
            scopeRaf = requestAnimationFrame(drawScope);
            if (!dspReady || dspFailed || !dspPanel.classList.contains('open')) return;

            const rect = scopeCanvas.getBoundingClientRect();
            const w = rect.width, h = rect.height;
            if (w === 0) return;

            const bins = analyser.frequencyBinCount;
            const data = new Uint8Array(bins);
            analyser.getByteFrequencyData(data);

            scopeCtx.clearRect(0, 0, w, h);

            // Log-spaced bars so the display matches how we hear pitch
            const bars = 56;
            const gap = 1.5;
            const barW = (w - gap * (bars - 1)) / bars;
            const nyquist = ctx.sampleRate / 2;
            const minF = 30, maxF = Math.min(18000, nyquist);

            for (let i = 0; i < bars; i++) {
                const f0 = minF * Math.pow(maxF / minF, i / bars);
                const f1 = minF * Math.pow(maxF / minF, (i + 1) / bars);
                const b0 = Math.floor(f0 / nyquist * bins);
                const b1 = Math.max(b0 + 1, Math.floor(f1 / nyquist * bins));

                let peak = 0;
                for (let b = b0; b < b1 && b < bins; b++) if (data[b] > peak) peak = data[b];

                const mag = peak / 255;
                const barH = Math.max(1.5, mag * h);
                const x = i * (barW + gap);
                const y = h - barH;

                const grad = scopeCtx.createLinearGradient(0, h, 0, y);
                grad.addColorStop(0, 'rgba(192,132,252,0.85)');
                grad.addColorStop(1, 'rgba(34,211,238,0.95)');
                scopeCtx.fillStyle = grad;

                scopeCtx.beginPath();
                if (scopeCtx.roundRect) scopeCtx.roundRect(x, y, barW, barH, 1.5);
                else scopeCtx.rect(x, y, barW, barH);
                scopeCtx.fill();
            }
        }

        /* --- DSP UI wiring --- */
        function bindSlider(id, key, suffix) {
            const el = document.getElementById(id);
            const out = document.getElementById(id + '-val');
            el.addEventListener('input', () => {
                dspState[key] = parseFloat(el.value);
                out.innerText = dspState[key].toFixed(1) + ' ' + suffix;
                if (!ctx) buildGraph();
                applyDspState();
            });
        }

        bindSlider('eq-bass', 'bass', 'dB');
        bindSlider('eq-mid', 'mid', 'dB');
        bindSlider('eq-treble', 'treble', 'dB');
        bindSlider('eq-gain', 'gain', 'dB');

        function bindToggle(id, key) {
            const el = document.getElementById(id);
            el.addEventListener('click', () => {
                if (!ctx) buildGraph();
                dspState[key] = !dspState[key];
                el.classList.toggle('on', dspState[key]);
                applyDspState();
            });
        }

        bindToggle('tg-crossfeed', 'crossfeed');
        bindToggle('tg-compressor', 'compressor');
        bindToggle('tg-mono', 'mono');

        document.getElementById('tg-reset').addEventListener('click', () => {
            dspState.bass = dspState.mid = dspState.treble = dspState.gain = 0;
            dspState.crossfeed = dspState.compressor = dspState.mono = false;

            [['eq-bass','bass'],['eq-mid','mid'],['eq-treble','treble'],['eq-gain','gain']].forEach(([id,k]) => {
                document.getElementById(id).value = 0;
                document.getElementById(id + '-val').innerText = '0.0 dB';
            });
            ['tg-crossfeed','tg-compressor','tg-mono'].forEach(id =>
                document.getElementById(id).classList.remove('on'));

            applyDspState();
        });

        toggleDspBtn.addEventListener('click', () => {
            const open = dspPanel.classList.toggle('open');
            toggleDspBtn.classList.toggle('enabled', open);
            if (open) {
                if (!ctx) buildGraph();
                requestAnimationFrame(sizeCanvas);
            }
        });

        /* ============================================================
           REAL FILE METADATA

           Reads the first 64 bytes over an HTTP Range request and
           parses the FLAC STREAMINFO block for the true sample rate,
           bit depth, channel count and total sample count. The
           Content-Range header gives the file size, which with the
           duration yields the real average bitrate.

           No guessing, no filename heuristics.
           ============================================================ */
        async function readRealMetadata(track) {
            const url = streamUrlFor(track);

            try {
                const res = await fetch(url, { headers: { Range: 'bytes=0-63' } });
                if (!res.ok && res.status !== 206) throw new Error('HTTP ' + res.status);

                const buf = new Uint8Array(await res.arrayBuffer());

                // Total size from Content-Range: "bytes 0-63/29671234"
                let totalBytes = track.sizeBytes || null;
                const cr = res.headers.get('Content-Range');
                if (cr) {
                    const m = cr.match(/\/(\d+)$/);
                    if (m) totalBytes = parseInt(m[1], 10);
                }

                // FLAC magic
                if (buf.length >= 42 &&
                    buf[0] === 0x66 && buf[1] === 0x4C && buf[2] === 0x61 && buf[3] === 0x43) {

                    // STREAMINFO begins at byte 8 (4 magic + 4 block header)
                    const sampleRate = (buf[18] << 12) | (buf[19] << 4) | (buf[20] >> 4);
                    const channels = ((buf[20] >> 1) & 0x07) + 1;
                    const bitsPerSample = (((buf[20] & 0x01) << 4) | (buf[21] >> 4)) + 1;

                    // 36-bit total sample count
                    const totalSamples =
                        ((buf[21] & 0x0F) * 4294967296) +
                        (buf[22] * 16777216) + (buf[23] * 65536) + (buf[24] * 256) + buf[25];

                    const duration = sampleRate > 0 ? totalSamples / sampleRate : 0;
                    const bitrate = (totalBytes && duration > 0)
                        ? Math.round((totalBytes * 8) / duration / 1000)
                        : null;

                    return {
                        format: 'FLAC',
                        sampleRate: (sampleRate / 1000).toFixed(1) + ' kHz',
                        bitDepth: bitsPerSample + '-bit',
                        channels: channels,
                        bitrate: bitrate ? bitrate + ' kbps' : null,
                        duration: duration,
                        measured: true
                    };
                }

                // WAV magic: "RIFF"...."WAVE"
                if (buf.length >= 36 &&
                    buf[0] === 0x52 && buf[1] === 0x49 && buf[2] === 0x46 && buf[3] === 0x46) {

                    const sampleRate = buf[24] | (buf[25] << 8) | (buf[26] << 16) | (buf[27] << 24);
                    const byteRate   = buf[28] | (buf[29] << 8) | (buf[30] << 16) | (buf[31] << 24);
                    const channels   = buf[22] | (buf[23] << 8);
                    const bits       = buf[34] | (buf[35] << 8);

                    return {
                        format: 'WAV',
                        sampleRate: (sampleRate / 1000).toFixed(1) + ' kHz',
                        bitDepth: bits + '-bit',
                        channels: channels,
                        bitrate: byteRate ? Math.round(byteRate * 8 / 1000) + ' kbps' : null,
                        duration: null,
                        measured: true
                    };
                }

                // Unrecognised container — report only what we know
                return {
                    format: track.format || 'Unknown',
                    sampleRate: track.sampleRate,
                    bitDepth: track.bitDepth,
                    channels: null,
                    bitrate: track.bitrate,
                    duration: null,
                    measured: false
                };

            } catch (err) {
                console.warn('[Aura] header read failed:', err.message);
                return {
                    format: track.format || 'Unknown',
                    sampleRate: track.sampleRate,
                    bitDepth: track.bitDepth,
                    channels: null,
                    bitrate: track.bitrate,
                    duration: null,
                    measured: false
                };
            }
        }

        function renderSpecs(meta) {
            const set = (el, val, measured) => {
                if (val) {
                    el.innerText = val;
                    el.classList.remove('dim');
                    el.classList.toggle('warn', !measured);
                    el.title = measured
                        ? 'Read from the file header'
                        : 'Not verified — reported by the indexer, not measured';
                } else {
                    el.innerText = '—';
                    el.classList.add('dim');
                    el.classList.remove('warn');
                    el.title = 'Could not be determined';
                }
            };

            set(specFormat, meta.format + (meta.channels ? ` · ${meta.channels}ch` : ''), meta.measured);
            set(specRate, (meta.sampleRate && meta.bitDepth) ? `${meta.sampleRate} / ${meta.bitDepth}` : meta.sampleRate, meta.measured);
            set(specBitrate, meta.bitrate, meta.measured);
            updateOutputSpec();
            updatePathSpec();
        }

        /* ============================================================
           LIBRARY
           ============================================================ */
        fetch(PLAYLIST_API)
            .then(res => {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            })
            .then(data => {
                if (!Array.isArray(data) || data.length === 0) throw new Error('Feed returned no tracks');
                allTracks = data;
                buildPlaylistTabs();
                renderTracks('all');
            })
            .catch(err => {
                console.error("[Aura] Playlist feed failed:", err);
                libraryEl.innerHTML = `<p style="color:#f87171; text-align:center; padding:1.5rem; font-size:0.8rem;">
                    Could not load library.<br>${err.message}</p>`;
            });

        function buildPlaylistTabs() {
            const folders = new Set();
            allTracks.forEach(t => { if (t.folder && t.folder !== 'All Tracks') folders.add(t.folder); });

            playlistList.innerHTML = '';

            const allTab = document.createElement('div');
            allTab.className = 'playlist-tab active';
            allTab.setAttribute('data-folder', 'all');
            allTab.innerHTML = `<i class="fa-solid fa-music"></i> All Tracks`;
            playlistList.appendChild(allTab);

            folders.forEach(f => {
                const tab = document.createElement('div');
                tab.className = 'playlist-tab';
                tab.setAttribute('data-folder', f);
                tab.innerHTML = `<i class="fa-solid fa-folder"></i> ${f}`;
                playlistList.appendChild(tab);
            });

            document.querySelectorAll('.playlist-tab').forEach(tab => {
                tab.onclick = () => {
                    document.querySelectorAll('.playlist-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    renderTracks(tab.getAttribute('data-folder'));
                };
            });
        }

        function renderTracks(folderFilter) {
            libraryEl.innerHTML = '';
            visibleTracks = (folderFilter === 'all')
                ? allTracks.slice()
                : allTracks.filter(t => t.folder === folderFilter);
            currentIndex = -1;

            if (visibleTracks.length === 0) {
                libraryEl.innerHTML = `<p style="color: var(--text-sub); text-align: center; padding: 1.5rem; font-size: 0.8rem;">No tracks in playlist.</p>`;
                return;
            }

            visibleTracks.forEach((t, idx) => {
                const div = document.createElement('div');
                div.className = 'track';
                div.innerHTML = `
                    <div class="track-info">
                        <span class="track-title">${t.title}</span>
                        <span class="track-artist">${t.artist || 'Unknown Artist'}</span>
                    </div>
                    <div class="play-indicator-dot"></div>
                `;
                div.onclick = () => playTrack(idx);
                libraryEl.appendChild(div);
            });
        }

        function highlightActive() {
            document.querySelectorAll('#library .track').forEach((el, idx) => {
                el.classList.toggle('active', idx === currentIndex);
            });
        }

        /* ============================================================
           PLAYBACK
           ============================================================ */
        // Must be set before any src is assigned, or the graph is tainted.
        audioEl.crossOrigin = 'anonymous';

        function playTrack(index) {
            if (index < 0 || index >= visibleTracks.length) return;
            currentIndex = index;
            const track = visibleTracks[currentIndex];

            highlightActive();

            dockTitleEl.innerText = track.title;
            dockArtistEl.innerText = track.artist || 'Unknown Artist';
            dockArtistEl.classList.remove('error');

            if (track.cover) {
                albumArtImg.src = track.cover;
                albumArtImg.style.display = 'block';
            } else {
                albumArtImg.style.display = 'none';
            }

            specFormat.innerText = specRate.innerText = specBitrate.innerText = '…';
            specFormat.classList.add('dim');
            specRate.classList.add('dim');
            specBitrate.classList.add('dim');

            audioEl.src = streamUrlFor(track);
            audioEl.load();

            if (!ctx) buildGraph();
            if (ctx && ctx.state === 'suspended') ctx.resume();

            const p = audioEl.play();
            if (p && p.catch) {
                p.catch(err => {
                    if (err.name === 'NotAllowedError') {
                        dockArtistEl.innerText = 'Press play to start';
                    } else {
                        console.warn('[Aura] play() rejected:', err.name, err.message);
                    }
                });
            }

            readRealMetadata(track).then(renderSpecs);
        }

        audioEl.onerror = () => {
            const e = audioEl.error;
            console.error('[Aura] AUDIO ERROR', e && e.code, e && e.message, audioEl.currentSrc);
            dockArtistEl.innerText = 'Playback failed (see console)';
            dockArtistEl.classList.add('error');
            statusLight.className = 'status-indicator failed';
            specPath.innerText = 'SOURCE ERROR';
            playIcon.className = 'fa-solid fa-play';
        };

        playPauseBtn.onclick = () => {
            if (!audioEl.src) {
                if (visibleTracks.length > 0) playTrack(0);
                return;
            }
            if (!ctx) buildGraph();
            if (ctx && ctx.state === 'suspended') ctx.resume();

            if (audioEl.paused) {
                const p = audioEl.play();
                if (p && p.catch) p.catch(e => console.warn('[Aura]', e.name, e.message));
            } else {
                audioEl.pause();
            }
        };

        nextBtn.onclick = () => {
            if (visibleTracks.length === 0) return;
            if (isShuffle) playTrack(Math.floor(Math.random() * visibleTracks.length));
            else {
                let n = currentIndex + 1;
                if (n >= visibleTracks.length) n = 0;
                playTrack(n);
            }
        };

        prevBtn.onclick = () => {
            if (visibleTracks.length === 0) return;
            let p = currentIndex - 1;
            if (p < 0) p = visibleTracks.length - 1;
            playTrack(p);
        };

        shuffleBtn.onclick = () => {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('active', isShuffle);
        };

        function formatTime(secs) {
            if (isNaN(secs) || !isFinite(secs)) return "0:00";
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        audioEl.ontimeupdate = () => {
            const current = audioEl.currentTime;
            const duration = audioEl.duration;
            currentLabel.innerText = formatTime(current);
            if (!isNaN(duration) && isFinite(duration)) {
                const percentage = (current / duration) * 100;
                seekerProgress.style.width = `${percentage}%`;
                seekerKnob.style.left = `${percentage}%`;
                totalLabel.innerText = formatTime(duration);
            }
        };

        audioEl.onprogress = () => {
            if (audioEl.buffered.length > 0 && isFinite(audioEl.duration)) {
                const end = audioEl.buffered.end(audioEl.buffered.length - 1);
                seekerBuffered.style.width = `${(end / audioEl.duration) * 100}%`;
            }
        };

        audioEl.onloadedmetadata = () => { totalLabel.innerText = formatTime(audioEl.duration); };

        function updateSeekerPos(clientX) {
            const rect = seekerContainer.getBoundingClientRect();
            const percentage = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
            if (!isNaN(audioEl.duration) && isFinite(audioEl.duration)) {
                audioEl.currentTime = percentage * audioEl.duration;
            }
        }

        let isDraggingSeeker = false;
        seekerContainer.onmousedown = (e) => { isDraggingSeeker = true; updateSeekerPos(e.clientX); };

        seekerContainer.onmousemove = (e) => {
            const rect = seekerContainer.getBoundingClientRect();
            const hoverX = e.clientX - rect.left;
            const percentage = Math.max(0, Math.min(1, hoverX / rect.width));
            if (!isNaN(audioEl.duration) && isFinite(audioEl.duration)) {
                seekerTooltip.style.left = `${hoverX}px`;
                seekerTooltip.innerText = `${formatTime(percentage * audioEl.duration)} - ${Math.round(percentage * 100)}%`;
                seekerTooltip.style.display = 'block';
            }
        };

        seekerContainer.onmouseleave = () => { seekerTooltip.style.display = 'none'; };

        function updateVolume(clientX) {
            const rect = volumeSlider.getBoundingClientRect();
            const percentage = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
            audioEl.volume = percentage;
            volumeProgress.style.width = `${percentage * 100}%`;
            audioEl.muted = false;
            updateMuteIcon();
        }

        let isDraggingVolume = false;
        volumeSlider.onmousedown = (e) => { isDraggingVolume = true; updateVolume(e.clientX); };

        window.addEventListener('mousemove', (e) => {
            if (isDraggingSeeker) updateSeekerPos(e.clientX);
            if (isDraggingVolume) updateVolume(e.clientX);
        });

        window.addEventListener('mouseup', () => { isDraggingSeeker = false; isDraggingVolume = false; });

        muteBtn.onclick = () => { audioEl.muted = !audioEl.muted; updateMuteIcon(); };

        function updateMuteIcon() {
            if (audioEl.muted || audioEl.volume === 0) muteIcon.className = "fa-solid fa-volume-xmark";
            else if (audioEl.volume < 0.5) muteIcon.className = "fa-solid fa-volume-low";
            else muteIcon.className = "fa-solid fa-volume-high";
        }

        audioEl.volume = 0.8;
        volumeProgress.style.width = '80%';

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') { e.preventDefault(); playPauseBtn.click(); }
            if (e.code === 'ArrowRight' && isFinite(audioEl.duration)) audioEl.currentTime += 5;
            if (e.code === 'ArrowLeft'  && isFinite(audioEl.duration)) audioEl.currentTime -= 5;
        });

        audioEl.onplay = () => {
            playIcon.className = "fa-solid fa-pause";
            albumArtImg.style.animationPlayState = 'running';
            dockArtistEl.classList.remove('error');
            if (ctx && ctx.state === 'suspended') ctx.resume();
            updatePathSpec();
            verifyAudible();
        };

        audioEl.onpause = () => {
            playIcon.className = "fa-solid fa-play";
            albumArtImg.style.animationPlayState = 'paused';
            updatePathSpec();
        };

        audioEl.onended = () => {
            playIcon.className = "fa-solid fa-play";
            albumArtImg.style.animationPlayState = 'paused';
            nextBtn.click();
        };

        sizeCanvas();
        drawScope();
    </script>
</body>
</html>
